name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ "main", "feature**" ]
  pull_request:
    branches: [ "main" ]

# Globale Variablen für das Docker-Image und GCP
env:
  IMAGE_NAME: ${{ secrets.DOCKER_USER }}/financesecureapp:${{ github.sha }}
  GCP_REGION: europe-west1

jobs:
  # SECURITY GATES (SAST & IaC)
  security-scans:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: SpotBugs SAST
        run: mvn -B clean verify

      - name: Semgrep SAST (Findet Secrets)
        uses: semgrep/semgrep-action@v1
        with:
          config: "p/java"
        env:
          SEMGREP_APP_TOKEN: "" # Lokal, kein SaaS

      - name: Checkov IaC Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: ./terraform
          framework: terraform

  # 2. BUILD & PUSH ZU DOCKER HUB
  build-and-push:
    needs: security-scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ env.IMAGE_NAME }} .
          docker push ${{ env.IMAGE_NAME }}

  # 3. DEPLOY TEST-UMGEBUNG & DAST-SCAN
  deploy-test-and-dast:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SERVICE_ACCOUNT }}'

      - name: Deploy to Cloud Run (Test-Umgebung)
        id: deploy-test
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: financeapp-test
          image: ${{ env.IMAGE_NAME }}
          region: ${{ env.GCP_REGION }}
          flags: '--allow-unauthenticated'

      - name: OWASP ZAP DAST Scan (Prüft die echte Test-URL)
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ steps.deploy-test.outputs.url }}
          fail_action: true

  # 4. DEPLOY PRODUKTIV-UMGEBUNG (NUR MAIN-BRANCH)
  deploy-prod:
    needs: deploy-test-and-dast
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SERVICE_ACCOUNT }}'

      - name: Deploy to Cloud Run (Produktiv-Umgebung)
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: financeapp-prod
          image: ${{ env.IMAGE_NAME }}
          region: ${{ env.GCP_REGION }}
          flags: '--allow-unauthenticated'