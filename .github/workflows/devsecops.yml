name: DevSecOps CI/CD Pipeline

# Anforderung 3 (Compliance): Pipeline startet bei Pushes auf Feature-Branches und bei Pull-Requests.
# Dies unterstützt das Vier-Augen-Prinzip und die Branch Protection Rules für den main-Branch.
on:
  push:
    branches: [ "main", "feature**" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  issues: write # Erlaubt den Security-Scannern das Erstellen von Tickets

# Globale Variablen für das Docker-Image und GCP
env:
  # Anforderung 4 (Schutz sensibler Daten): Nutzung von GitHub Secrets anstelle von hartcodierten Variablen im Quellcode
  IMAGE_NAME: ${{ secrets.DOCKER_USER }}/financesecureapp:${{ github.sha }}
  GCP_REGION: us-central1

jobs:
  # QUALITY GATE 1: STATISCHE ANALYSEN (Umsetzung des Shift-Left-Prinzips)
  security-scans:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Anforderung 1: SAST
      - name: SpotBugs SAST
        run: mvn -B clean verify

      # Anforderung 1: SAST
      - name: Semgrep SAST (Findet Secrets)
        uses: semgrep/semgrep-action@v1
        with:
          config: "p/java"
        env:
          SEMGREP_APP_TOKEN: "" # Lokal, kein SaaS (Kap. 5.1)

      # Anforderung 2: IaC-Scanning
      - name: Checkov IaC Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: ./terraform
          framework: terraform
          output_format: cli
          soft_fail: false # Fail-Fast: Bricht den Build bei Funden sofort ab

  # QUALITY GATE 2: BUILD & PUSH (Nur wenn Gate 1 erfolgreich durchlaufen wurde)
  build-and-push:
    needs: security-scans # Startet nur, wenn SAST/IaC fehlerfrei sind
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Anforderung 4: Sichere Authentifizierung über Secrets für GitHub Actions
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ env.IMAGE_NAME }} .
          docker push ${{ env.IMAGE_NAME }}

  # QUALITY GATE 3: DYNAMISCHE ANALYSE (DAST)
  deploy-test-and-dast:
    needs: build-and-push # Startet nur, wenn Build fehlerfrei war
    runs-on: ubuntu-latest
    steps:
      # Anforderung 4: Nutzung von GCP Service-Accounts nach dem Least-Privilege-Prinzip
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SERVICE_ACCOUNT }}'

      - name: Deploy to Cloud Run (Test-Umgebung)
        id: deploy-test
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: financeapp-test
          image: ${{ env.IMAGE_NAME }}
          region: ${{ env.GCP_REGION }}
          flags: '--allow-unauthenticated'

      # Anforderung 1 (DAST)
      - name: OWASP ZAP DAST Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ steps.deploy-test.outputs.url }}
          fail_action: true # FAIL-FAST: Bricht ab, wenn Laufzeit-Schwachstellen gefunden werden
          cmd_options: '-I'
          rules_file_name: '.zap/rules.tsv'

  # DEPLOYMENT IN PRODUKTION (Nur bei vollständiger Compliance)
  deploy-prod:
    needs: deploy-test-and-dast # Startet nur, wenn DAST fehlerfrei war
    if: github.ref == 'refs/heads/main' # Anforderung 3: Deployt nur Code aus dem main-Branch
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SERVICE_ACCOUNT }}'

      - name: Deploy to Cloud Run (Produktiv-Umgebung)
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: financeapp-prod
          image: ${{ env.IMAGE_NAME }}
          region: ${{ env.GCP_REGION }}
          flags: '--allow-unauthenticated'