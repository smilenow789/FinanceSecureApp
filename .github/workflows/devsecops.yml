name: DevSecOps CI/CD Pipeline

# Anforderung 3 (Compliance): Pipeline startet bei Pushes auf Feature-Branches und bei Pull-Requests.
# Dies unterstützt das Vier-Augen-Prinzip und die Branch Protection Rules für den main-Branch.
on:
  push:
    branches: [ "main", "feature**" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  issues: write # Erlaubt den Security-Scannern das Erstellen von Tickets

# Globale Variablen für das Docker-Image und GCP
env:
  # Anforderung 4 (Schutz sensibler Daten): Nutzung von GitHub Secrets anstelle von hartcodierten Variablen im Quellcode
  IMAGE_NAME: ${{ secrets.DOCKER_USER }}/financesecureapp:${{ github.sha }}
  GCP_REGION: us-central1

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ env.IMAGE_NAME }} .
          docker push ${{ env.IMAGE_NAME }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SERVICE_ACCOUNT }}'

      - name: Deploy to Cloud Run (Produktiv-Umgebung)
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: financeapp-prod
          image: ${{ env.IMAGE_NAME }}
          region: ${{ env.GCP_REGION }}
          flags: '--allow-unauthenticated'