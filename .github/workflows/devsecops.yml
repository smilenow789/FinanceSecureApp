name: DevSecOps Finance Pipeline

on:
  push:
    branches: [ "main", "feature" ]
  pull_request:
    branches: [ "main", "feature" ]

jobs:
  build-and-sast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # SAST 1: Führt den Maven Build inkl. SpotBugs & FindSecBugs aus.
      # Bricht ab, wenn der Java-Code unsicher ist.
      - name: Build and run SpotBugs SAST
        run: mvn clean verify

      # SAST 2: Semgrep Scan für Pattern-Matching und hardcodierte Secrets
      - name: Semgrep SAST Scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: "p/java" # Nutzt die offiziellen Java-Security-Regeln

  dast-scan:
    needs: build-and-sast
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build App
        run: mvn clean package -DskipTests

      # Startet die Spring Boot App im Hintergrund
      - name: Start Spring Boot Application
        run: java -jar target/*.jar &

      # Wartet kurz, bis die App hochgefahren ist (Port 8080)
      - name: Wait for App to start
        run: sleep 15

      # DAST: Führt den OWASP ZAP Baseline Scan gegen die laufende App aus
      - name: OWASP ZAP DAST Scan
        uses: zaproxy/action-baseline@v0.11.0
        with:
          target: 'http://localhost:8080'
          fail_action: true # Pipeline schlägt fehl, wenn ZAP Lücken findet